name: Bug Report
description: Report incorrect classification, PowerShell errors, or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug or unexpected classification.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command run
      description: Exact command (e.g., `.\Optimize-Disk.ps1 -Mode Report`)
      render: powershell
    validations:
      required: true
  - type: input
    id: ps_version
    attributes:
      label: Windows & PowerShell version
      placeholder: "e.g., Windows 11 24H2 / PowerShell 5.1"
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output / Error message
      render: text
